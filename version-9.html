<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toy Soldiers - Honeycomb</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1a252f; color: #ecf0f1; margin: 0; padding: 12px; display: flex; flex-direction: column; align-items: center; }
  h1 { margin: 0 0 4px; color: #f39c12; font-size: 1.4rem; }
  .status-banner { background: #f39c12; color: #1a252f; padding: 8px 16px; border-radius: 8px; font-weight: bold; margin-bottom: 10px; text-align: center; min-width: 420px; }
  .container { display: flex; gap: 14px; max-width: 1500px; width: 100%; }
  .sidebar { width: 300px; background: #2c3e50; padding: 12px; border-radius: 10px; }
  .board-container { flex: 1; background: #145a32; border: 6px solid #8b4513; border-radius: 10px; overflow: auto; }
  #board { position: relative; height: 700px; background: #0e3d20; }
  .hex { position: absolute; width: var(--hex-w); height: var(--hex-h); clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); background: #1e8449; }
  .hex.open { background: #1e8449; } .hex.forest { background: #0e4b2a; } .hex.hill { background: #6e5b00; }
  .hex.water { background: #1a5276; } .hex.rock { background: #5d6d7e; }
  .hex.in-range { outline: 3px solid #e74c3c; box-shadow: inset 0 0 10px rgba(231,76,60,0.45); }
  .hex.move-range { outline: 2px dashed #f1c40f; }
  .hex.valid-target { background: #c0392b !important; }
  .unit { position: absolute; width: 40px; height: 40px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 18px; z-index: 10; transform: translate(-50%, -50%); cursor: pointer; }
  .unit.selected { border: 3px solid #f1c40f !important; box-shadow: 0 0 12px #f1c40f; animation: pulse 1.2s infinite; z-index: 20; }
  .unit.pl1 { background: #2980b9; border: 3px solid #85c1e9; }
  .unit.pl2 { background: #c0392b; border: 3px solid #f1948a; }
  .unit.hit { animation: hit 0.35s; }
  @keyframes pulse { 50% { box-shadow: 0 0 18px #f1c40f; } }
  @keyframes hit { 50% { filter: brightness(2.5) sepia(1) hue-rotate(-40deg); transform: translate(-50%, -50%) scale(1.2); } }
  .hp-bar { width: 34px; height: 5px; background: #222; border-radius: 2px; margin-top: 1px; overflow: hidden; }
  .hp-fill { height: 100%; background: #27ae60; } .hp-fill.low { background: #e74c3c; }
  button { background: #f39c12; border: none; padding: 7px; margin: 3px 0; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
  button.ai { background: #e74c3c; color: white; }
  .unit-btn { padding: 5px 8px; background: #1a252f; margin: 3px 0; border-radius: 5px; cursor: pointer; font-size: 14px; }
  #log { height: 130px; overflow-y: auto; background: #1a252f; padding: 6px; font-size: 11px; border-radius: 5px; margin-top: 8px; }
  .current-unit { background: #1a252f; padding: 8px; border-radius: 6px; margin: 6px 0; border-left: 4px solid #f1c40f; font-size: 13px; }
  .radial-menu { position: absolute; z-index: 50; pointer-events: none; }
  .radial-item { position: absolute; min-width: 68px; height: 28px; padding: 0 6px; background: #2c3e50; border: 2px solid #f39c12; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; cursor: pointer; pointer-events: auto; color: white; white-space: nowrap; }
  .radial-item:hover { background: #f39c12; color: #1a252f; }
</style>
</head>
<body>
<h1>🪖 Toy Soldiers</h1>
<div class="status-banner" id="banner">Buy units or Start vs AI</div>

<div class="container">
  <div class="sidebar">
    <div>You: <b id="pm">100</b> pts &nbsp; AI: <b id="am">100</b> pts</div>
    <div class="current-unit" id="cur">No active unit</div>

    <h4 style="margin:8px 0 4px">Buy</h4>
    <div class="unit-btn" onclick="buy('soldier',1)">🪖 Infantry (10)</div>
    <div class="unit-btn" onclick="buy('mg',1)">🎯 MG (25)</div>
    <div class="unit-btn" onclick="buy('tank',1)">🚜 Tank (50)</div>
    <button class="ai" onclick="startAI()">Start vs AI</button>

    <h4 style="margin:10px 0 4px">Terrain</h4>
    <div class="unit-btn" onclick="paint('forest')">🌲 Forest</div>
    <div class="unit-btn" onclick="paint('hill')">⛰️ Hill</div>
    <div class="unit-btn" onclick="paint('water')">💧 Water</div>
    <div class="unit-btn" onclick="paint('rock')">🪨 Rock</div>
    <div class="unit-btn" onclick="paint(null)">Stop painting</div>
    <button onclick="randomTerrain()">Random Terrain</button>

    <button onclick="skip()">Skip this unit</button>
    <button onclick="newRound()">New Round</button>
    <div id="log"></div>
  </div>
  <div class="board-container"><div id="board"></div></div>
</div>

<script>
const HEX_SIZE = 32; // center to flat
const HEX_W = HEX_SIZE * 2;
const HEX_H = Math.sqrt(3) * HEX_SIZE;
const COLS = 12, ROWS = 9;

let units = [], cur = null, queue = [], uid = 0, paintMode = null, terr = {}, hexes = [];
let pm = 100, am = 100, aiOn = false, radial = null, attackMode = false, isGren = false;

const types = {
  soldier: { n: 'Infantry', i: '🪖', mv: 4, rg: 5, at: '1d6', df: 3, hp: 4, c: 10, gr: 1 },
  mg: { n: 'MG', i: '🎯', mv: 2, rg: 8, at: '2d6', df: 4, hp: 6, c: 25 },
  tank: { n: 'Tank', i: '🚜', mv: 5, rg: 6, at: '3d6', df: 6, hp: 10, c: 50, sp: 1 }
};
const fx = { open: { m: 1, b: 0, c: 0, i: 0 }, forest: { m: 2, b: 1, c: 2, i: 0 }, hill: { m: 1, b: 0, c: 0, i: 0 }, water: { m: 99, b: 0, c: 0, i: 1 }, rock: { m: 99, b: 1, c: 0, i: 1 } };

const k = (q, r) => q + ',' + r;
const dist = (a, b) => (Math.abs(a.q - b.q) + Math.abs(a.r - b.r) + Math.abs(a.q + a.r - b.q - b.r)) / 2;

// Pointy-top perfect tiling
function px(q, r) {
  const x = HEX_SIZE * Math.sqrt(3) * (q + r / 2) + 40;
  const y = HEX_SIZE * 1.5 * r + 40;
  return { x, y };
}

// Simple Web Audio sounds (free, no files)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  if (type === 'hit') { o.frequency.value = 180; g.gain.setValueAtTime(0.15, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15); o.start(); o.stop(audioCtx.currentTime + 0.15); }
  else if (type === 'miss') { o.frequency.value = 90; g.gain.setValueAtTime(0.08, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); o.start(); o.stop(audioCtx.currentTime + 0.1); }
  else if (type === 'move') { o.frequency.value = 440; g.gain.setValueAtTime(0.06, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08); o.start(); o.stop(audioCtx.currentTime + 0.08); }
  else if (type === 'buy') { o.frequency.value = 660; g.gain.setValueAtTime(0.1, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12); o.start(); o.stop(audioCtx.currentTime + 0.12); }
}

function init() {
  document.documentElement.style.setProperty('--hex-w', HEX_W + 'px');
  document.documentElement.style.setProperty('--hex-h', HEX_H + 'px');
  const b = document.getElementById('board'); b.innerHTML = ''; hexes = [];
  for (let r = 0; r < ROWS; r++) for (let q = 0; q < COLS; q++) {
    const p = px(q, r);
    const h = document.createElement('div');
    h.className = 'hex open';
    h.style.left = (p.x - HEX_W / 2) + 'px';
    h.style.top = (p.y - HEX_H / 2) + 'px';
    h.dataset.q = q; h.dataset.r = r;
    h.onclick = () => clickHex(q, r);
    b.appendChild(h);
    hexes.push({ q, r, el: h });
    terr[k(q, r)] = 'open';
  }
  render(); setBanner('Buy units or Start vs AI');
}
function setBanner(t) { document.getElementById('banner').textContent = t; }
function paint(m) { paintMode = m; setBanner(m ? 'Painting ' + m : 'Paint off'); }
function randomTerrain() {
  hexes.forEach(h => {
    const r = Math.random();
    let t = 'open';
    if (r < 0.18) t = 'forest';
    else if (r < 0.28) t = 'hill';
    else if (r < 0.34) t = 'water';
    else if (r < 0.38) t = 'rock';
    terr[k(h.q, h.r)] = t;
    h.el.className = 'hex ' + t;
  });
  log('Random terrain generated');
  playSound('buy');
}
function clickHex(q, r) {
  if (paintMode) {
    terr[k(q, r)] = paintMode;
    const h = hexes.find(x => x.q === q && x.r === r);
    if (h) h.el.className = 'hex ' + paintMode;
    return;
  }
  if (cur && cur.pl === 1 && !cur.moved && !attackMode) {
    if (dist(cur, { q, r }) <= cur.mv && !imp(q, r) && !units.some(u => u.q === q && u.r === r)) {
      cur.q = q; cur.r = r; cur.moved = 1;
      log(cur.n + ' moved'); playSound('move'); render(); showRadial(); setBanner('Moved — pick action');
    }
  }
}
function buy(type, pl) {
  const t = types[type];
  if (pl === 1 && pm < t.c) { log('Not enough'); return; }
  if (pl === 2 && am < t.c) return;
  let q = pl === 1 ? 1 : COLS - 2, r = 3;
  for (let i = 0; i < 20; i++) { if (!units.some(u => u.q === q && u.r === r) && !imp(q, r)) break; r = (r + 1) % ROWS; }
  if (units.some(u => u.q === q && u.r === r) || imp(q, r)) { log('No space'); return; }
  if (pl === 1) pm -= t.c; else am -= t.c;
  units.push({ id: uid++, ty: type, pl, n: t.n, i: t.i, q, r, mv: t.mv, rg: t.rg, at: t.at, df: t.df, hp: t.hp, mx: t.hp, gr: t.gr || 0, sp: !!t.sp, moved: 0, acted: 0, st: null, aim: 0 });
  playSound('buy'); rebuild(); render(); ui(); log('Bought ' + t.n);
}
function imp(q, r) { return fx[terr[k(q, r)] || 'open'].i; }
function rebuild() {
  const a = units.filter(u => u.pl === 1), b = units.filter(u => u.pl === 2);
  queue = [];
  for (let i = 0; i < Math.max(a.length, b.length); i++) { if (a[i]) queue.push(a[i]); if (b[i]) queue.push(b[i]); }
  next();
}
function next() {
  hideR(); attackMode = false;
  cur = queue.find(u => units.includes(u) && !u.acted) || null;
  if (cur) {
    log('→ ' + cur.n + ' (' + (cur.pl === 1 ? 'YOU' : 'AI') + ')');
    if (cur.pl === 2 && aiOn) setTimeout(aiDo, 300);
    else { showRadial(); setBanner(cur.n + ' — menu or drag to move'); }
  } else setBanner('Round finished — New Round');
  ui(); render();
}
function render() {
  document.querySelectorAll('.unit').forEach(e => e.remove());
  const b = document.getElementById('board');
  units.forEach(u => {
    const p = px(u.q, u.r);
    const el = document.createElement('div');
    el.className = 'unit pl' + u.pl + (cur && cur.id === u.id ? ' selected' : '');
    el.dataset.id = u.id;
    el.innerHTML = u.i + '<div class="hp-bar"><div class="hp-fill' + (u.hp <= u.mx / 3 ? ' low' : '') + '" style="width:' + (u.hp / u.mx * 100) + '%"></div></div>';
    el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
    el.draggable = cur && cur.id === u.id && u.pl === 1 && !attackMode;
    el.ondragstart = e => e.dataTransfer.setData('id', u.id);
    el.onclick = e => { e.stopPropagation(); onUnitClick(u); };
    b.appendChild(el);
  });
  highlight();
}
function highlight() {
  hexes.forEach(h => h.el.classList.remove('in-range', 'move-range', 'valid-target'));
  if (!cur) return;
  hexes.forEach(h => {
    const dd = dist(cur, h);
    if (dd > 0 && dd <= cur.rg) h.el.classList.add('in-range');
    if (dd > 0 && dd <= cur.mv && !imp(h.q, h.r)) h.el.classList.add('move-range');
  });
  if (attackMode) {
    units.filter(u => u.pl !== cur.pl && dist(cur, u) <= (isGren ? 2 : cur.rg) && (isGren || hasLOS(cur, u)))
      .forEach(u => { const h = hexes.find(x => x.q === u.q && x.r === u.r); if (h) h.el.classList.add('valid-target'); });
  }
}
document.getElementById('board').ondragover = e => e.preventDefault();
document.getElementById('board').ondrop = e => {
  e.preventDefault();
  if (!cur || cur.pl !== 1 || cur.moved || attackMode) return;
  const rct = document.getElementById('board').getBoundingClientRect();
  const x = e.clientX - rct.left, y = e.clientY - rct.top;
  let best = null, bd = 999;
  hexes.forEach(h => { const p = px(h.q, h.r); const dd = Math.hypot(p.x - x, p.y - y); if (dd < bd && dd < 28) { bd = dd; best = h; } });
  if (!best) return;
  if (dist(cur, best) > cur.mv || imp(best.q, best.r) || units.some(u => u.q === best.q && u.r === best.r && u.id !== cur.id)) { log('Invalid'); return; }
  cur.q = best.q; cur.r = best.r; cur.moved = 1;
  log(cur.n + ' moved'); playSound('move'); render(); showRadial();
};
function showRadial() {
  hideR();
  if (!cur || cur.pl !== 1) return;
  const p = px(cur.q, cur.r);
  radial = document.createElement('div');
  radial.className = 'radial-menu';
  radial.style.left = p.x + 'px'; radial.style.top = p.y + 'px';
  const acts = [
    { l: '⚔️ Attack', f: () => beginAttack(0) },
    { l: '🛡️ Defend', f: () => stance('defend') },
    { l: '🎯 Aim', f: () => stance('aim') },
    { l: '👁️ Overwatch', f: () => stance('overwatch') }
  ];
  if (cur.gr > 0) acts.push({ l: '💣 Grenade', f: () => beginAttack(1) });
  acts.forEach((a, i) => {
    const it = document.createElement('div');
    it.className = 'radial-item'; it.textContent = a.l;
    const ang = (i / acts.length) * Math.PI * 2 - Math.PI / 2;
    it.style.left = Math.cos(ang) * 58 + 'px'; it.style.top = Math.sin(ang) * 58 + 'px';
    it.onclick = e => { e.stopPropagation(); a.f(); };
    radial.appendChild(it);
  });
  document.getElementById('board').appendChild(radial);
}
function hideR() { if (radial) { radial.remove(); radial = null; } }
function stance(s) {
  if (cur.acted) return;
  cur.st = s; if (s === 'aim') cur.aim = 1;
  cur.acted = 1;
  log(cur.n + ' ' + s); next();
}
function beginAttack(gren) {
  if (cur.acted) return;
  attackMode = true; isGren = gren;
  hideR();
  setBanner((gren ? 'GRENADE' : 'ATTACK') + ' — click a red enemy (or press Cancel)');
  highlight();
  // Add temporary cancel button
  let cancelBtn = document.getElementById('cancelBtn');
  if (!cancelBtn) {
    cancelBtn = document.createElement('button');
    cancelBtn.id = 'cancelBtn';
    cancelBtn.textContent = 'Cancel Attack';
    cancelBtn.style.background = '#7f8c8d';
    cancelBtn.style.marginTop = '6px';
    cancelBtn.onclick = cancelAttack;
    document.querySelector('.sidebar').insertBefore(cancelBtn, document.getElementById('log'));
  }
  cancelBtn.style.display = 'block';
}
function cancelAttack() {
  attackMode = false;
  isGren = false;
  const btn = document.getElementById('cancelBtn');
  if (btn) btn.style.display = 'none';
  setBanner(cur.n + ' — menu or drag to move');
  showRadial();
  highlight();
}
function onUnitClick(u) {
  if (!attackMode || !cur || u.pl === cur.pl) return;
  const maxR = isGren ? 2 : cur.rg;
  if (dist(cur, u) > maxR || (!isGren && !hasLOS(cur, u))) { 
    log('Out of range or blocked — try another or Cancel'); 
    return; 
  }
  const btn = document.getElementById('cancelBtn');
  if (btn) btn.style.display = 'none';
  doAttack(cur, u, isGren);
  attackMode = false;
}
function doAttack(a, t, gren) {
  const rolls = parse(a.at); if (a.aim) rolls.push(1 + Math.floor(Math.random() * 6));
  const tot = rolls.reduce((x, y) => x + y, 0);
  const cover = fx[terr[k(t.q, t.r)] || 'open'].c || 0;
  const defB = t.st === 'defend' ? 2 : 0;
  const need = t.df + cover + defB;
  const hit = tot >= need;
  log(`${a.n} ${gren ? '💣' : '⚔️'} ${t.n} [${rolls.join(',')}] = ${tot} vs ${need} → ${hit ? 'HIT' : 'MISS'}`);
  playSound(hit ? 'hit' : 'miss');
  if (hit) {
    t.hp -= gren ? 2 : 1;
    const el = document.querySelector(`.unit[data-id="${t.id}"]`);
    if (el) { el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 350); }
    if (a.sp && !gren) {
      units.filter(u => u.pl !== a.pl && dist(t, u) === 1).forEach(s => {
        s.hp--; log('Splash ' + s.n);
        if (s.hp <= 0) units = units.filter(x => x.id !== s.id);
      });
    }
    if (t.hp <= 0) { units = units.filter(x => x.id !== t.id); log(t.n + ' destroyed'); }
    else log(t.n + ' HP ' + t.hp);
    if (!gren && Math.random() < 0.3) {
      log('CRIT!');
      const nxt = units.find(u => u.pl !== a.pl && dist(a, u) <= a.rg && hasLOS(a, u));
      if (nxt) setTimeout(() => doAttack(a, nxt, 0), 350);
    }
  }
  if (gren) a.gr--;
  a.acted = 1; a.aim = 0;
  setTimeout(next, 250);
}
function parse(s) { const m = s.match(/(\d+)d(\d+)/); if (!m) return [1 + Math.floor(Math.random() * 6)]; const a = []; for (let i = 0; i < +m[1]; i++) a.push(1 + Math.floor(Math.random() * +m[2])); return a; }
function hasLOS(a, b) { const line = hexLine(a, b); for (let i = 1; i < line.length - 1; i++) if (fx[terr[k(line[i].q, line[i].r)] || 'open'].b) return false; return true; }
function hexLine(a, b) { const n = dist(a, b); const r = []; for (let i = 0; i <= n; i++) { const t = n ? i / n : 0; const q = a.q + (b.q - a.q) * t, rr = a.r + (b.r - a.r) * t; r.push(hexRound(q, rr, -q - rr)); } return r; }
function hexRound(q, r, s) { let rq = Math.round(q), rr = Math.round(r), rs = Math.round(s); const qd = Math.abs(rq - q), rd = Math.abs(rr - r), sd = Math.abs(rs - s); if (qd > rd && qd > sd) rq = -rr - rs; else if (rd > sd) rr = -rq - rs; else rs = -rq - rr; return { q: rq, r: rr }; }
function skip() { if (cur) { cur.acted = 1; next(); } }
function newRound() { units.forEach(u => { u.moved = 0; u.acted = 0; if (u.st !== 'overwatch') u.st = null; }); rebuild(); log('New round'); }
function ui() {
  document.getElementById('pm').textContent = pm;
  document.getElementById('am').textContent = am;
  const c = document.getElementById('cur');
  if (cur) c.innerHTML = `<b>${cur.i} ${cur.n}</b> (${cur.pl === 1 ? 'YOU' : 'AI'})<br>HP ${cur.hp}/${cur.mx} · Grenades ${cur.gr}`;
  else c.textContent = 'Round over';
}
function startAI() { aiOn = true; pm = am = 100; units = []; rebuild(); ui(); setBanner('vs AI — buy your forces'); aiBuy(); }
function aiBuy() { const prefs = [{ t: 'soldier', w: 5 }, { t: 'mg', w: 2 }, { t: 'tank', w: 1 }]; let s = 0; while (am >= 10 && s++ < 8) { const aff = prefs.filter(p => types[p.t].c <= am); if (!aff.length) break; let tot = aff.reduce((a, p) => a + p.w, 0), r = Math.random() * tot, ch = aff[0].t; for (const p of aff) { r -= p.w; if (r <= 0) { ch = p.t; break; } } buy(ch, 2); } }
function aiDo() {
  if (!cur || cur.pl !== 2) return;
  const ens = units.filter(u => u.pl === 1);
  if (!ens.length) { setBanner('You lose'); return; }
  const tgts = ens.filter(e => dist(cur, e) <= cur.rg && hasLOS(cur, e));
  if (tgts.length) { tgts.sort((a, b) => a.hp - b.hp); doAttack(cur, tgts[0], 0); return; }
  let near = ens[0], md = dist(cur, near); ens.forEach(e => { const dd = dist(cur, e); if (dd < md) { md = dd; near = e; } });
  let best = null, bs = 99;
  hexes.forEach(h => { if (imp(h.q, h.r) || units.some(u => u.q === h.q && u.r === h.r && u.id !== cur.id)) return; const dh = dist(cur, h); if (dh > cur.mv) return; const sc = dist(h, near); if (sc < bs) { bs = sc; best = h; } });
  if (best) { cur.q = best.q; cur.r = best.r; cur.moved = 1; log(cur.n + ' advances'); playSound('move'); }
  cur.acted = 1;
  setTimeout(next, 200);
}
function log(m) { const l = document.getElementById('log'); l.innerHTML += m + '<br>'; l.scrollTop = l.scrollHeight; }
init();
</script>
</body>
</html>
